<!DOCTYPE html>
<!-- DPXJS v1 - Author: 0xdexblood - https://github.com/0xdexblood -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>DPXJS viewer</title>
<link rel="icon" href="icons/logo.png">
<style>
:root {
  --bg: #0b0b0f; --panel: #1a1a22; --line: #2a2a35; --text: #c9c9d1; --muted: #7d7d8a;
  --brand: #8b5cf6; --brand2: #6d28d9; --accent: #ff7a1a;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 12px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
#app { display: flex; flex-direction: column; height: 100%; }
header { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 6px; }
.brand img { display: block; border-radius: 4px; }
.logo { font-size: 17px; font-weight: 800; letter-spacing: 1px; color: var(--brand); }
#file { flex: 1; min-width: 200px; font: 12px ui-monospace, Consolas, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#file a { color: var(--brand); text-decoration: none; } #file a:hover { color: var(--accent); text-decoration: underline; }
button { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 4px 10px; cursor: pointer; }
button:hover { border-color: var(--brand); } button:disabled { opacity: .4; cursor: default; }
#pos { color: var(--muted); min-width: 120px; text-align: center; }
#note { padding: 3px 12px; color: var(--muted); background: var(--panel); border-bottom: 1px solid var(--line); }
#note b { color: var(--accent); font-weight: 600; }
#note[hidden] { display: none; }
main { flex: 1; overflow: auto; }
#code { font: 12px/1.5 ui-monospace, Consolas, "Courier New", monospace; padding: 6px 0; min-width: max-content; }
.ln { display: flex; white-space: pre; }
.num { flex: 0 0 64px; text-align: right; padding-right: 12px; color: var(--muted); user-select: none; }
.txt { flex: 1; padding-right: 20px; }
.ln.hit { background: rgba(255, 122, 26, .16); }
.ln.hit .num { color: var(--accent); }
mark { background: var(--accent); color: #000; border-radius: 2px; padding: 0 1px; }
.more { display: block; margin: 6px auto; }
.dim { color: var(--muted); }
#err { padding: 40px; text-align: center; color: #ff4d2e; }
#err[hidden] { display: none; }
footer { padding: 4px 12px; text-align: center; font-size: 10px; color: var(--muted); background: var(--panel); border-top: 1px solid var(--line); }
footer a { color: var(--brand); text-decoration: none; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><img id="logo" src="icons/logo.png" width="22" height="22" alt=""><span class="logo">DPXJS</span></div>
    <div id="file"></div>
    <button id="prev" type="button">&larr; Prev finding</button>
    <span id="pos"></span>
    <button id="next" type="button">Next finding &rarr;</button>
  </header>
  <div id="note" hidden></div>
  <main id="main"><div id="err" hidden></div><div id="code"></div></main>
  <footer>DPXJS v1 by <a href="https://github.com/0xdexblood" target="_blank" rel="noopener noreferrer">0xdexblood</a></footer>
</div>
<script src="viewer.js"></script>
</body>
</html>
