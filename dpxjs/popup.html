<!DOCTYPE html>
<!-- DPXJS v1 - Author: 0xdexblood - https://github.com/0xdexblood -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>DPXJS</title>
<link rel="icon" href="icons/logo.png">
<style>
:root {
  --bg: #0b0b0f; --panel: #1a1a22; --line: #2a2a35; --text: #c9c9d1; --muted: #7d7d8a;
  --brand: #8b5cf6; --brand2: #6d28d9; --accent: #ff7a1a; --accent2: #f97316;
  --crit: #ff4d2e; --high: #ff6a2b; --med: #ff9a3d; --low: #8b5cf6; --info: #6b6b78;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 760px; height: 580px; background: var(--bg); color: var(--text);
  font: 12px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
html.tab, html.tab body { width: 100%; height: 100%; }
#app { display: flex; flex-direction: column; height: 100%; position: relative; }
header { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 6px; }
.brand img { display: block; border-radius: 4px; }
.logo { font-size: 17px; font-weight: 800; letter-spacing: 1px; color: var(--brand); }
.ver { font-size: 10px; padding: 1px 6px; border-radius: 8px; background: var(--brand2); color: #fff; }
.actions { display: flex; gap: 6px; }
button { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 4px 10px; cursor: pointer; }
button:hover { border-color: var(--brand); }
button:disabled { opacity: .5; cursor: default; }
.primary { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; }
.primary:hover { background: var(--brand2); }
.ai { background: transparent; color: var(--accent); border-color: var(--accent); font-weight: 700; padding: 1px 8px; }
.ai:hover { background: var(--accent); color: #000; border-color: var(--accent); }
.icon { padding: 4px 8px; font-size: 14px; line-height: 1; }
#target { padding: 2px 12px; font: 11px ui-monospace, Consolas, monospace; color: var(--muted); background: var(--panel); border-bottom: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#target[hidden] { display: none; }
#progress { display: flex; align-items: center; gap: 8px; padding: 4px 12px; background: var(--panel); border-bottom: 1px solid var(--line); color: var(--muted); }
#progress[hidden] { display: none; }
.bar { flex: 1; height: 5px; background: var(--bg); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--brand), var(--accent)); transition: width .2s; }
nav { display: flex; gap: 2px; padding: 6px 12px 0; border-bottom: 1px solid var(--line); }
nav button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 5px 12px; color: var(--muted); }
nav button.on { color: var(--accent); border-bottom-color: var(--accent); }
nav b { margin-left: 5px; padding: 0 6px; border-radius: 8px; background: var(--panel); color: var(--text); font-weight: 600; font-size: 10px; }
#tools { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.chip { padding: 1px 8px; border-radius: 10px; font-size: 11px; opacity: .45; }
.chip.on { opacity: 1; }
input[type=text], input[type=password], select { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 5px; padding: 3px 7px; font: inherit; }
input:focus, select:focus { outline: 1px solid var(--brand); }
#q { flex: 1; min-width: 120px; }
label { color: var(--muted); display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
main { flex: 1; overflow-y: auto; padding: 8px 12px; }
main::-webkit-scrollbar { width: 8px; } main::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
.empty { text-align: center; color: var(--muted); padding: 50px 20px; }
.hint { color: var(--accent); font-weight: 600; }
.gh { display: flex; justify-content: space-between; margin: 10px 0 4px; padding: 3px 8px; background: var(--panel); border-left: 3px solid var(--brand); border-radius: 3px; cursor: pointer; font-weight: 600; }
.gh span { color: var(--muted); font-weight: 400; }
.row { border: 1px solid var(--line); background: var(--panel); border-radius: 5px; padding: 5px 8px; margin-bottom: 4px; }
.row.cand { border-style: dashed; }
.rh { display: flex; align-items: center; gap: 7px; }
.sev { min-width: 56px; text-align: center; padding: 0 6px; border-radius: 3px; font-size: 10px; font-weight: 700; color: #0b0b0f; }
.sCritical { background: var(--crit); } .sHigh { background: var(--high); } .sMedium { background: var(--med); } .sLow { background: var(--low); color: #fff; } .sInfo { background: var(--info); color: #fff; }
.desc { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.loc { border: 0; background: none; padding: 0 2px; color: var(--brand); font-family: ui-monospace, Consolas, monospace; font-size: 11px; max-width: 190px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
a.loc { text-decoration: underline; text-decoration-color: var(--line); }
a.loc:hover { color: var(--accent); text-decoration-color: var(--accent); }
.conf { font-size: 10px; color: var(--muted); } .cHigh { color: #7bd88f; } .cMedium { color: var(--med); }
.rh button { padding: 0 7px; font-size: 11px; }
.rh button.mini { padding: 0 6px; color: var(--muted); }
.rh button.mini:hover { color: var(--accent); }
.chain { margin-top: 3px; color: var(--accent); font-family: ui-monospace, Consolas, monospace; font-size: 11px; word-break: break-all; }
.snip { margin-top: 3px; color: var(--muted); font-family: ui-monospace, Consolas, monospace; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ctx { margin: 5px 0 0; padding: 5px; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; font: 11px/1.4 ui-monospace, Consolas, monospace; overflow-x: auto; }
.ctx div { white-space: pre; } .ctx .n { display: inline-block; width: 38px; color: var(--muted); user-select: none; }
.ctx .hit { background: rgba(255, 122, 26, .18); color: #fff; }
.aipanel { margin-top: 6px; border-top: 1px dashed var(--line); padding-top: 6px; }
.aitool { display: flex; align-items: center; gap: 6px; color: var(--accent); font-size: 11px; margin-bottom: 4px; }
.aitool .st { flex: 1; }
.aitool button { padding: 0 7px; font-size: 11px; }
.err { color: var(--crit); }
.aibody { font-size: 12px; max-height: 220px; overflow: auto; user-select: text; }
.hint { color: var(--muted); font-size: 11px; margin-top: 4px; }
.spin { display: inline-block; width: 11px; height: 11px; margin-right: 6px; vertical-align: -2px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: sp .7s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }
.md p, .md ul { margin: 3px 0; } .md ul { padding-left: 18px; } .md .h { font-weight: 700; color: var(--accent); margin-top: 6px; }
.md code { background: var(--bg); padding: 0 4px; border-radius: 3px; font-family: ui-monospace, Consolas, monospace; }
.md pre { background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 6px; overflow-x: auto; margin: 4px 0; font: 11px/1.4 ui-monospace, Consolas, monospace; }
.kind { min-width: 56px; text-align: center; font-size: 10px; padding: 0 6px; border-radius: 3px; background: var(--brand2); color: #fff; }
.tag { font-size: 10px; padding: 0 6px; border-radius: 3px; border: 1px solid var(--line); color: var(--muted); }
.tag.third { color: var(--accent); border-color: var(--accent); }
.url { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: ui-monospace, Consolas, monospace; font-size: 11px; }
.eptools { display: flex; gap: 6px; margin-bottom: 6px; align-items: center; }
.eptools span { margin-left: auto; color: var(--muted); }
.more { display: block; margin: 8px auto; }
#summary { margin-bottom: 8px; border: 1px solid var(--accent); border-radius: 5px; padding: 6px 8px; background: var(--panel); }
#summary .aipanel { border-top: 0; margin-top: 0; padding-top: 0; }
.sumhead { display: flex; justify-content: space-between; align-items: center; color: var(--accent); font-size: 11px; margin-bottom: 4px; }
details.inv { margin: 10px 0; border: 1px solid var(--line); border-radius: 5px; background: var(--panel); }
details.inv > summary { cursor: pointer; padding: 5px 8px; font-weight: 600; color: var(--brand); }
details.inv > summary span { color: var(--muted); font-weight: 400; }
details.inv .body { padding: 4px 8px 8px; }
.src { display: flex; align-items: baseline; gap: 8px; padding: 2px 0; border-bottom: 1px solid var(--line); }
.src b { min-width: 190px; font-family: ui-monospace, Consolas, monospace; font-weight: 500; }
.src em { min-width: 34px; color: var(--accent); font-style: normal; }
.src .links { display: flex; flex-wrap: wrap; gap: 8px; }
.src a { font-family: ui-monospace, Consolas, monospace; font-size: 11px; color: var(--brand); }
.src a:hover { color: var(--accent); }
#settings { position: absolute; inset: 0; background: var(--bg); padding: 14px 18px; overflow-y: auto; z-index: 5; }
#settings[hidden], #summary[hidden] { display: none; }
#settings h3 { margin: 0 0 10px; color: var(--brand); }
.field { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.field > span { width: 90px; color: var(--muted); } .field input[type=text], .field input[type=password], .field select { flex: 1; }
.field.check > span { width: auto; flex: 1; }
.about { margin-top: 18px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; }
a { color: var(--muted); text-decoration: none; } a:hover { color: var(--accent); }
.about a { color: var(--brand); }
footer { padding: 4px 12px; text-align: center; font-size: 10px; color: var(--muted); background: var(--panel); border-top: 1px solid var(--line); }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><img id="logo" src="icons/logo.png" width="22" height="22" alt=""><span class="logo">DPXJS</span><span class="ver">v1</span></div>
    <div class="actions">
      <button id="scan" class="primary">Scan</button>
      <button id="aiSum" class="ai">AI Summary</button>
      <button id="export">Export</button>
      <button id="openTab" title="Open in a tab (a popup closes when it loses focus)">Open in tab</button>
      <button id="gear" class="icon" title="Settings">&#9881;</button>
    </div>
  </header>
  <div id="target" hidden></div>
  <div id="progress" hidden><div class="bar"><i></i></div><span></span></div>
  <nav id="tabs"></nav>
  <div id="tools">
    <span id="chips"></span>
    <input id="q" type="text" placeholder="Filter...">
    <label><input id="hideLow" type="checkbox"> hide low confidence</label>
    <select id="sort"><option value="severity">Sort: severity</option><option value="file">Sort: file</option></select>
  </div>
  <main id="view"></main>
  <section id="settings" hidden>
    <h3>Settings</h3>
    <div class="field"><span>API key</span><input id="cfgToken" type="password" placeholder="sk-..." autocomplete="off" spellcheck="false"></div>
    <div id="cfgHint" class="hint" hidden>Add your Numes API key in Settings to use AI.</div>
    <div class="field"><span>Model</span><input id="cfgModel" type="text" placeholder="deepseek/deepseek-v4.1-flash" autocomplete="off" spellcheck="false"></div>
    <div class="field check"><label><input id="cfgAuto" type="checkbox"> Auto-scan after navigation</label></div>
    <div class="field check"><label><input id="cfgCand" type="checkbox"> Show unverified candidates (Info tab)</label></div>
    <div class="field"><span></span><button id="cfgSave" class="primary">Save</button><button id="cfgTest">Test connection</button><button id="cfgClose">Close</button></div>
    <div id="cfgStatus"></div>
    <div class="about">About: DPXJS v1 - Author: <a href="https://github.com/0xdexblood" target="_blank" rel="noopener noreferrer">0xdexblood</a></div>
  </section>
  <footer>DPXJS v1 by <a href="https://github.com/0xdexblood" target="_blank" rel="noopener noreferrer">0xdexblood</a></footer>
</div>
<script src="popup.js"></script>
</body>
</html>
